description = "Redmi K30 Pro Zoom Edition; initial UEFI bring-up"
kit = "lmipro"
[components]
include = ["DarwinBoot"]
[kernel]
defconfig = "lmipro_uefi_defconfig"
config_fragments = []
patch_series = []
[firmware]
config = "lmipro"
dsc = "Platforms/Xiaomi/lmiproPkg/lmipro.dsc"
fd = "Build/lmiproPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]
[firmware.defines]
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"
[payload]
tools = true
