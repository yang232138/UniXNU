name: houji iPhone iOS 26 kernel

on:
  push:
    branches: [houji/ios26-iphone-bringup, houji/ios26-iphone-apfs-audit]
    paths:
      - '.github/workflows/iphone-ios26-kernel.yml'
      - '.github/workflows/houji-uefi.yml'
      - 'targets/ios-26.6.2-23G90/**'
      - 'tools/build-iphone-ios26.py'
      - 'sources.lock.json'

permissions:
  contents: read

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out pinned UniXNU
        run: |
          set -euo pipefail
          revision=$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["iphone_ios26"]["unixnu_revision"])')
          git init -q "$RUNNER_TEMP/UniXNU"
          git -C "$RUNNER_TEMP/UniXNU" fetch --depth 1 https://github.com/UniXNU/UniXNU.git "$revision"
          git -C "$RUNNER_TEMP/UniXNU" checkout --detach FETCH_HEAD
      - name: Verify source and native kernel configuration
        run: |
          set -euo pipefail
          python3 tools/check-source-tree.py
          python3 tools/build-iphone-ios26.py --unixnu "$RUNNER_TEMP/UniXNU" --output out/iphone26 --check
      - name: Prepare and record toolchain
        run: |
          set -euo pipefail
          mkdir -p out/iphone26/evidence
          {
            git rev-parse HEAD
            git -C "$RUNNER_TEMP/UniXNU" rev-parse HEAD
            uname -m
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos --find mig
          } | tee out/iphone26/evidence/toolchain.txt
          brew install llvm lld dtc mtools
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
          fi
      - name: Build arm64e XNU
        run: |
          set -euo pipefail
          audit=()
          if [ "$GITHUB_REF_NAME" = houji/ios26-iphone-apfs-audit ]; then
            audit=(--apfs-audit)
            export UNIXNU_IPSW_JOBS=8
          fi
          python3 -u tools/build-iphone-ios26.py --unixnu "$RUNNER_TEMP/UniXNU" --output out/iphone26 "${audit[@]}" 2>&1 \
            | tee out/iphone26/evidence/compile.txt

      - name: Build and verify the unattended RAM payload
        if: github.ref_name == 'houji/ios26-iphone-bringup'
        env:
          HOUJI_ARTIFACT_KEY: ${{ secrets.HOUJI_IPHONE26_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/out/iphone26"
          board="$GITHUB_WORKSPACE/targets/ios-26.6.2-23G90"
          (
            cd "$RUNNER_TEMP/UniXNU"
            python3 unixnu build payload --device "$board" --out "$output" --os ios-26.6.2-23G90
          ) 2>&1 | tee "$output/evidence/payload.log"
          work="$output/houji/ios-26.6.2-23G90/houji_iphone26"
          payload="$work/payload/payload.img"
          for name in unixnu.toml Payloads/kernel.macho Payloads/kernel.macho.adt; do
            mcopy -i "$payload" "::/EFI/UniXNU/$name" "$RUNNER_TEMP/${name##*/}"
          done
          cmp "$work/kernel/kernel.macho" "$RUNNER_TEMP/kernel.macho"
          python3 -m venv "$RUNNER_TEMP/artifact-python"
          "$RUNNER_TEMP/artifact-python/bin/pip" install cryptography==50.0.2
          "$RUNNER_TEMP/artifact-python/bin/python" - "$payload" "$output/evidence" <<'PY'
          import base64, hashlib, json, os, struct, sys, tomllib, zlib
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          source, out = map(Path, sys.argv[1:])
          temp = Path(os.environ["RUNNER_TEMP"])
          configuration = tomllib.loads((temp / "unixnu.toml").read_text())
          entry = configuration["entry"][0]
          if configuration["boot"] != {"default": "xnu", "timeout": 5} or (
              entry["id"], entry["type"], entry["path"]
          ) != ("xnu", "xnu", "Payloads/kernel.macho") or "initrd" in entry:
              raise SystemExit("Invalid automatic first-entry configuration")
          adt = (temp / "kernel.macho.adt").read_bytes()
          offset = adt.index(b"random-seed\0")
          if struct.unpack_from("<I", adt, offset + 32)[0] != 256:
              raise SystemExit("Incorrect XNU random-seed length")
          data = source.read_bytes()
          if len(data) != 0x4000000 or data[71:90] != b"HOUJIESP   FAT32   ":
              raise SystemExit("Unexpected FAT payload geometry")
          expected = json.loads(source.with_suffix(".json").read_text())
          if hashlib.sha256(data).hexdigest() != expected["payload_sha256"]:
              raise SystemExit("FAT payload digest mismatch")
          key = base64.b64decode(os.environ["HOUJI_ARTIFACT_KEY"], validate=True)
          nonce = os.urandom(12)
          encrypted = AESGCM(key).encrypt(nonce, data, b"payload.img")
          (out / "payload.img.aesgcm").write_bytes(nonce + encrypted)
          (out / "payload.json").write_text(json.dumps({
              "sha256": expected["payload_sha256"], "bytes": len(data),
              "crc32": f"{zlib.crc32(data):08x}", "kernel_sha256": expected["kernel_sha256"],
              "adt_sha256": hashlib.sha256(adt).hexdigest(), "automatic_boot_seconds": 5,
              "contains_xnu": True, "hardware_tested": False,
          }, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: houji-23G90-kernel-evidence
          path: |
            out/iphone26/evidence/
            out/iphone26/resolved-profile.json
            out/iphone26/houji/**/logs/*.log
            out/iphone26/houji/**/kernel/kernel.json
            out/iphone26/houji/**/xnu-inputs.json

  firmware:
    if: github.ref_name == 'houji/ios26-iphone-bringup'
    needs: kernel
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/houji-uefi.yml
    with:
      iphone26: true
    secrets:
      HOUJI_305_UEFI_INPUT_20261120: ${{ secrets.HOUJI_305_UEFI_INPUT_20261120 }}
      HOUJI_IPHONE26_ARTIFACT_KEY: ${{ secrets.HOUJI_IPHONE26_ARTIFACT_KEY }}
