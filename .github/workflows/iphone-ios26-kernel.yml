name: houji iPhone iOS 26 kernel

on:
  push:
    branches: [houji/ios26-iphone-bringup]
    paths:
      - '.github/workflows/iphone-ios26-kernel.yml'
      - 'targets/ios-26.6.2-23G90/**'
      - 'tools/build-iphone-ios26.py'
      - 'sources.lock.json'

permissions:
  contents: read

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out pinned UniXNU
        run: |
          set -euo pipefail
          revision=$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["iphone_ios26"]["unixnu_revision"])')
          git init -q "$RUNNER_TEMP/UniXNU"
          git -C "$RUNNER_TEMP/UniXNU" fetch --depth 1 https://github.com/UniXNU/UniXNU.git "$revision"
          git -C "$RUNNER_TEMP/UniXNU" checkout --detach FETCH_HEAD
      - name: Verify source and native kernel configuration
        run: |
          set -euo pipefail
          python3 tools/check-source-tree.py
          python3 tools/build-iphone-ios26.py --unixnu "$RUNNER_TEMP/UniXNU" --output out/iphone26 --check
      - name: Prepare and record toolchain
        run: |
          set -euo pipefail
          mkdir -p out/iphone26/evidence
          {
            git rev-parse HEAD
            git -C "$RUNNER_TEMP/UniXNU" rev-parse HEAD
            uname -m
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos --find mig
          } | tee out/iphone26/evidence/toolchain.txt
          brew install llvm lld
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
          fi
      - name: Build arm64e XNU
        run: |
          set -euo pipefail
          python3 -u tools/build-iphone-ios26.py --unixnu "$RUNNER_TEMP/UniXNU" --output out/iphone26 2>&1 \
            | tee out/iphone26/evidence/compile.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: houji-23G90-kernel-evidence
          path: |
            out/iphone26/evidence/
            out/iphone26/resolved-profile.json
            out/iphone26/houji/**/logs/*.log
            out/iphone26/houji/**/kernel/kernel.json
            out/iphone26/houji/**/xnu-inputs.json
