name: K30 Pro device firmware
on:
  push:
    branches: [k30pro-fresh-20261028]
    paths: ['ci/**', 'device/**', '.github/workflows/lmipro-firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm nasm uuid-dev build-essential device-tree-compiler mtools python3-venv acpica-tools
          python3 -m venv .venv
          .venv/bin/pip install uefi_firmware==1.16
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build target UEFI from pinned sources and stock lmipro XBL
        run: bash ci/firmware-build.sh
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p results
          if [ -d upstream/out ]; then find upstream/out -name '*.log' -exec cp {} results/ \;; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lmipro-device-firmware
          path: results/
          retention-days: 14
