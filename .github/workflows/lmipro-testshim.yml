name: K30 Pro test BootShim
on:
  push:
    branches: [k30pro-fresh-20261028]
    paths: ['.github/workflows/lmipro-testshim.yml']
permissions:
  contents: read
jobs:
  shim:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Build BootShim
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y llvm
          mkdir results
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Project-Silicium/Mu-Silicium/4cba43c90e02cdbefbcd9fcdbda33d2328deaec0/BootShim/BootShim.S -o results/BootShim.S
          clang --target=aarch64-none-elf -c -DFD_BASE=0x9fc00000 -DFD_SIZE=0x300000 -DREQUIRES_KERNEL_HEADER=1 results/BootShim.S -o results/shim.o
          llvm-objcopy -O binary results/shim.o results/shim.bin
          llvm-nm -n results/shim.o > results/symbols.txt
          sha256sum results/shim.bin > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lmipro-test-bootshim
          path: results/
          retention-days: 14
