[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["firmware/**", ".github/workflows/uefi.yml", "proprietary-files.txt"]
inputs = ["Public yang232138/uefi-lmipro overlay at 20e41895a8b24c9b2a32aa3b81947f45280d49f7; Mu-Silicium e51cd877e31c8fbb322032dc4cb6715e83d25ad3; Mu_Basecore cfb93724a06ff86ff5ba971413368a7809ee42a5.", "Target MIUI V14.0.4.0.SJKCNXM XBL ELF SHA256 25821d1f882fef9ec6a4db75f8d0a6ed9d173919e68dda9ed4dc39cf5e1519fc, checked before extraction."]
configuration = ["board.toml selects lmi config, Platforms/Xiaomi/lmiPkg/lmi.dsc and Build/lmiPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd.", "DSC/FDF contain UniXNU, UniXNUDxe, DarwinBoot, UniXNURamDiskDxe, DiskIo/Partition/FAT/EnglishDxe and AdvancedLogDxe; DXE Advanced Logger collects in RAM."]
procedure = ["Follow https://unixnu.com/zh/porting/uefi-firmware and /zh/porting/log-capture.", "Extract target XBL modules and uefiplat.cfg, validate unique PE/depex paths and memory-map overlaps, then run ./unixnu build package firmware --uefi ../mu."]
findings = ["Historical public lmi memory/config maps differ from this handset XBL. Generate them from the hash-checked target uefiplat.cfg; split the unusable DDR prefix around its explicit IPC SHM entry.", "Run 40671017967 stopped on the exact DTB hash guard: Ubuntu libfdt 1.7.0 overwrote six existing audio phandles. Pin libfdt 1.8.1 at 8f48565e5cfedc74d3f7512f1e0188e9d85dc1de, retaining the exact hash guard; reuse only the two independently hash-pinned original tree inputs from that run. Vendor PE and depex sections are copied byte-for-byte; no vendor code patch is applied. Disable stock LogFS syncing for the temporary test policy. Run 40669467496 exposed a missing runtime-binary FDF rule; add that rule while preserving the original PE subsystem, and use unique .efi filenames matched by the shared FDF rules."]
completion = ["FD builds at the configured path and exact 0x300000 size, module inventory and hashes match, then separately verify the UniXNU menu and logs on the device."]
limits = ["UEFI compilation and runtime remain separate checkpoints. Previous SCM/TZ initialization failures are unresolved on this clean source baseline; do not replay old diagnostic images or claim a working menu.", "boot.img is an Android-v2 UEFI-only smoke-test image with an empty ramdisk; no XNU kernel or OS payload is included. No kernel boot, storage or permanent installation is validated. No image is automatically booted by CI."]
next_action = ["Deliver boot.img with the validated FD, exact target firmware DTB hash and section round-trip report; reconcile early DMA memory and inherited TZ state before declaring the image ready for a new phone test."]
evidence = [{kind = "source", reference = "https://github.com/yang232138/uefi-lmipro/tree/20e41895a8b24c9b2a32aa3b81947f45280d49f7", result = "Public board overlay imported without its binary archive, XBL input, DTB or workflow; integration and target extraction are reviewed separately."}]

