schema_version = 2

[board]
example = false # Concrete device inputs reviewed for kernel/package host checks; firmware and payload remain separate gates.
name = "lmipro"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Redmi K30 Pro Zoom Edition; configuration baseline, hardware bring-up incomplete"
kit = "lmipro"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "lmipro_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/lmipro.dts"
include_dirs = ["soc:dts"]

[firmware]
# Firmware platform contract; a reviewed matching UEFI checkout is still required.
config = "lmi"
dsc = "Platforms/Xiaomi/lmiPkg/lmi.dsc"
fd = "Build/lmiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"

[payload]
volume = "LMIPRO"
size_mib = 192
loader = "firmware"
title = "UniXNU"
tools = true
kernel_args = ["-v", "serial=3"]

[payload.adt]
# Supply the board's identity seed through --unique-chip-id.
chip_id = "207"
unique_chip_id = "required"
