schema_version = 2

[board]
name = "houji"
soc = "SM8650"
soc_source = "sm8650-houji"
os_profile = "ios-26.6.2-23G90"

[kernel]
defconfig = "houji_iphone26_defconfig"
config_fragments = ["arch:configs/common.config"]
patch_series = ["arch:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
]

[device_tree]
source = "device:houji-first-entry.dts"

[payload]
title = "iPhone iOS 26.6.2 XNU"
timeout = 5
volume = "HOUJIESP"
size_mib = 64
kernel_args = ["-v", "serial=3", "debug=0x14e", "keepsyms=1", "cpus=1"]

[payload.adt]
owned_memory_size = "0x10000000"
